services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: queue
      POSTGRES_DB: queue
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue -d queue"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Selesai sekali. Migrasi ulang: docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://queue:queue@db:5432/queue
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:-change-me}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://queue:queue@db:5432/queue
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
