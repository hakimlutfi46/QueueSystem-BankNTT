services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: queue
      POSTGRES_DB: queue
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue -d queue"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Menyala lagi sendiri setelah server dimatikan dan dihidupkan.
    restart: unless-stopped

  # Selesai sekali. Migrasi ulang: docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://queue:queue@db:5432/queue
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
      # Wajib diisi di .env; Compose berhenti dengan pesan bila kosong.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Isi SEED_ADMIN_PASSWORD di .env}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:?Isi SEED_STAFF_PASSWORD di .env}
      SEED_ORG_NAME: ${SEED_ORG_NAME:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://queue:queue@db:5432/queue
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
      AUTH_SECRET: ${AUTH_SECRET:?Isi AUTH_SECRET di .env dengan string acak yang panjang}
      # Opsional. Kiosk dan TV didaftarkan dari Admin → Perangkat; kosong berarti tidak ada token cadangan.
      KIOSK_TOKEN: ${KIOSK_TOKEN:-}
      DISPLAY_TOKEN: ${DISPLAY_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Cadangan harian ke folder ./backups di server, disimpan BACKUP_KEEP_DAYS hari (bawaan 30).
  # Pulihkan: lihat README bagian Backup database.
  backup:
    image: postgres:16
    environment:
      PGPASSWORD: queue
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          file=/backups/queue-$$(date +%Y%m%d-%H%M%S).dump
          if pg_dump --format=custom --no-owner --no-privileges -h db -U queue -d queue -f "$$file.partial" && pg_restore --list "$$file.partial" > /dev/null; then
            mv "$$file.partial" "$$file" && echo "Cadangan dibuat: $$file"
          else
            rm -f "$$file.partial"; echo "Backup gagal" >&2
          fi
          find /backups -name 'queue-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
