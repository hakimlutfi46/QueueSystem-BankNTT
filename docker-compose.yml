services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: queue
      POSTGRES_DB: queue
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue -d queue"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Selesai sekali. Migrasi ulang: docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://queue:queue@db:5432/queue
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
      # Wajib diisi di .env; Compose berhenti dengan pesan bila kosong.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Isi SEED_ADMIN_PASSWORD di .env}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:?Isi SEED_STAFF_PASSWORD di .env}
      SEED_ORG_NAME: ${SEED_ORG_NAME:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://queue:queue@db:5432/queue
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
      AUTH_SECRET: ${AUTH_SECRET:?Isi AUTH_SECRET di .env dengan string acak yang panjang}
      # Opsional. Kiosk dan TV didaftarkan dari Admin → Perangkat; kosong berarti tidak ada token cadangan.
      KIOSK_TOKEN: ${KIOSK_TOKEN:-}
      DISPLAY_TOKEN: ${DISPLAY_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
