<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Admin Kiosk</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main>
    <h1>Menu admin</h1>
    <p class="muted" id="device"></p>
    <div id="alert" class="alert" role="alert"></div>
    <form id="form" novalidate autocomplete="off">
      <div class="field">
        <label for="pin">PIN admin</label>
        <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autofocus>
      </div>
      <div class="pad" id="pad"></div>
      <div class="actions">
        <button type="button" class="btn btn-danger" data-action="exit">Keluar aplikasi</button>
        <button type="button" class="btn btn-secondary" data-action="settings">Ubah pengaturan</button>
        <button type="button" class="btn btn-ghost" id="cancel">Batal</button>
      </div>
    </form>
  </main>
  <script src="admin.js"></script>
</body>
</html>
