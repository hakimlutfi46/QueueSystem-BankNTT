<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Pengaturan Kiosk</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="setup.css">
</head>
<body>
  <main class="card">
    <header>
      <img class="logo" id="logo" alt="" hidden>
      <div>
        <h1 id="title">Pemasangan Kiosk</h1>
        <p id="subtitle">Hubungkan kiosk ini ke server antrian. Minta kode pemasangan dari admin di menu Perangkat.</p>
      </div>
    </header>

    <div id="alert" class="alert" role="alert"></div>

    <form id="form" novalidate autocomplete="off">
      <div class="field" data-field="server">
        <label for="server">Alamat server</label>
        <input id="server" name="server" type="text" inputmode="url" spellcheck="false" placeholder="10.70.10.67:3000" required>
        <span class="hint">Contoh: 10.70.10.67:3000 atau http://antrian.lokal</span>
        <span class="error"></span>
      </div>

      <div class="field" data-field="code">
        <label for="code">Kode pemasangan</label>
        <input id="code" name="code" type="text" spellcheck="false" autocapitalize="characters" maxlength="9" placeholder="4K7-Q2M" class="code">
        <span class="hint" id="code-hint">6 karakter. Tanda hubung dan huruf kecil boleh.</span>
        <span class="error"></span>
      </div>

      <div class="field" data-field="printer">
        <label for="printer">Printer tiket</label>
        <div class="row">
          <select id="printer" name="printer"></select>
          <button type="button" class="btn btn-ghost icon" id="refresh" title="Muat ulang daftar printer" aria-label="Muat ulang daftar printer">&#x21bb;</button>
        </div>
        <div class="row">
          <button type="button" class="btn btn-secondary" id="test-print">Cetak uji</button>
          <span class="hint" id="test-result" aria-live="polite"></span>
        </div>
        <span class="error"></span>
      </div>

      <div class="grid">
        <div class="field" data-field="pin">
          <label for="pin">PIN admin</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="Minimal 4 angka">
          <span class="hint" id="pin-hint">Dipakai untuk keluar dari kiosk (Ctrl+Shift+Alt+K).</span>
          <span class="error"></span>
        </div>
        <div class="field" data-field="pinConfirm">
          <label for="pinConfirm">Ulangi PIN admin</label>
          <input id="pinConfirm" name="pinConfirm" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12">
          <span class="error"></span>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-ghost" id="cancel" hidden>Batal</button>
        <button type="submit" class="btn btn-primary" id="submit">Simpan &amp; pasangkan</button>
      </div>
    </form>
    <footer id="footer"></footer>
  </main>
  <script src="setup.js"></script>
</body>
</html>
