<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Pengaturan Kiosk</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="setup.css">
</head>
<body>
  <main class="card">
    <header>
      <img class="logo" id="logo" alt="" hidden>
      <div>
        <h1 id="title">Pemasangan Kiosk</h1>
        <p id="subtitle">Hubungkan kiosk ini ke server antrian.</p>
      </div>
    </header>

    <p id="simulation" class="alert info" hidden></p>
    <div id="alert" class="alert" role="alert"></div>

    <form id="form" novalidate autocomplete="off">
      <section class="servers" aria-labelledby="servers-title">
        <div class="servers-head">
          <h2 id="servers-title">Server di jaringan</h2>
          <button type="button" class="btn btn-ghost small-btn" id="rescan">Cari ulang</button>
        </div>
        <p class="scan-status" id="scan-status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="scan-text">Mencari server antrian di jaringan…</span></p>
        <ul class="server-list" id="server-list"></ul>
      </section>

      <div class="field" data-field="server">
        <label for="server">Alamat server</label>
        <div class="row">
          <input id="server" name="server" type="text" inputmode="url" spellcheck="false" placeholder="Contoh: 192.168.1.10:3000" required>
          <button type="button" class="btn btn-secondary" id="check">Periksa</button>
        </div>
        <span class="hint" id="server-hint">Terisi otomatis saat server dipilih. Contoh: 192.168.1.10:3000.</span>
        <span class="error"></span>
      </div>

      <p class="hint code-help">Kiosk tersambung otomatis lalu menunggu persetujuan admin.
        <button type="button" class="btn-link" id="open-admin">Buka panel admin <span class="arrow" aria-hidden="true">&nearr;</span></button>
        lalu <strong>Perangkat</strong> → Setujui.</p>

      <div class="field" data-field="printer">
        <label for="printer">Printer tiket</label>
        <div class="row">
          <select id="printer" name="printer"></select>
          <button type="button" class="btn btn-ghost icon" id="refresh" title="Muat ulang daftar printer" aria-label="Muat ulang daftar printer">&#x21bb;</button>
        </div>
        <div class="row">
          <button type="button" class="btn btn-secondary" id="test-print">Cetak uji</button>
          <span class="hint" id="test-result" aria-live="polite"></span>
        </div>
        <span class="error"></span>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-danger" id="exit" hidden>Keluar aplikasi</button>
        <button type="button" class="btn btn-ghost" id="cancel" hidden>Batal</button>
        <button type="submit" class="btn btn-primary" id="submit">Simpan &amp; sambungkan</button>
      </div>
    </form>
    <footer id="footer"></footer>
  </main>
  <script src="setup.js"></script>
</body>
</html>
